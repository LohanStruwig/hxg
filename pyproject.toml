[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hospitality-experience-graph"
version = "0.2.0"
description = "Evidence-audited research and publication pipeline for connected hospitality experiences"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Hospitality Experience Graph contributors" }]
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "networkx>=3.4,<4",
  "numpy>=2,<3",
  "httpx>=0.28,<1",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
research = [
  "openai-agents>=0.2,<1",
  "graphrag>=2.4,<3",
]
publication = [
  "Pillow>=11,<13",
  "reportlab>=4.2,<5",
  "qrcode>=8,<9",
]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "PyMuPDF>=1.27,<2",
  "pip-audit>=2.9,<3",
  "ruff>=0.9,<1",
]

[project.scripts]
hxg = "hxg.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hxg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
