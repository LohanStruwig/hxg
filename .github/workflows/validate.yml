name: Validate HXG release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,publication]"
      - run: hxg research --mode seed --cutoff 2026-08-19 --cost-limit-usd 10 --no-retrieve
      - run: hxg build-graph
      - run: hxg validate
      - run: hxg build-publication
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run check
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: site
      - run: npm run test:e2e
        working-directory: site
